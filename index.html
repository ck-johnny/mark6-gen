<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14b8a6" media="(prefers-color-scheme: dark)">
    <meta name="description" content="You're not gambling. You're donating. Thanks for your contribution.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <title>Mark Six Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --panel: #ffffff;
        --field: #fffdfa;
        --field-strong: #ffffff;
        --text: #202124;
        --muted: #687078;
        --line: #d9d2c4;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --accent-soft: #eef7f6;
        --accent-soft-hover: #d9efed;
        --chip: #eef7f6;
        --shadow: 0 18px 50px rgba(32, 33, 36, 0.12);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #101412;
        --panel: #181f1d;
        --field: #111816;
        --field-strong: #0d1311;
        --text: #f0f4f2;
        --muted: #aab7b2;
        --line: #33403c;
        --accent: #44b8a8;
        --accent-dark: #7bd4c8;
        --accent-soft: #1d3733;
        --accent-soft-hover: #274a44;
        --chip: #1d3733;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(860px, calc(100vw - 20px));
        margin: 0 auto;
        padding: 24px 0;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(190px, 0.72fr) minmax(320px, 1.28fr);
        gap: 18px;
        align-items: start;
      }

      .intro {
        padding: 14px 0;
      }

      .theme-toggle {
        min-height: 34px;
        margin-top: 14px;
        border: 1px solid var(--line);
        padding: 0 12px;
        background: var(--field);
        color: var(--text);
        font-size: 0.9rem;
      }

      .theme-toggle:hover {
        background: var(--accent-soft);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.9rem, 5vw, 3.8rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .intro p {
        max-width: 32rem;
        margin: 0;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.55;
      }

      .version {
        display: inline-flex;
        margin: 0 0 10px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--field);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .learn-more {
        display: inline-grid;
        min-height: 34px;
        margin: 10px 8px 0 0;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--field);
        color: var(--accent-dark);
        font-size: 0.9rem;
        font-weight: 800;
        text-decoration: none;
      }

      .learn-more:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(8rem, 0.72fr) auto;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      label,
      .control-group {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend {
        margin: 0 0 6px;
        padding: 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .mode-control {
        grid-column: 1;
      }

      .controls[data-mode="number"] .number-control {
        grid-column: 2 / -1;
      }

      .controls > button {
        display: none;
      }

      .mode-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }

      .mode-options input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      .mode-options span {
        display: grid;
        min-height: 34px;
        place-items: center;
        border-radius: 6px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 800;
        text-transform: none;
        cursor: pointer;
      }

      .mode-options input:checked + span {
        background: var(--accent);
        color: white;
      }

      input,
      button {
        min-height: 40px;
        border-radius: 8px;
        font: inherit;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        padding: 0 10px;
        color: var(--text);
        background: var(--field);
        font-size: 1rem;
      }

      button {
        align-self: end;
        border: 0;
        padding: 0 14px;
        background: var(--accent);
        color: white;
        font-weight: 800;
        cursor: pointer;
      }

      .stepper {
        display: grid;
        grid-template-columns: 40px minmax(42px, 1fr) 40px;
        gap: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
      }

      .stepper button {
        align-self: auto;
        width: 40px;
        min-height: 40px;
        border-radius: 0;
        padding: 0;
        background: var(--accent-soft);
        color: var(--accent-dark);
        font-size: 1.25rem;
        line-height: 1;
      }

      .stepper button:hover {
        background: var(--accent-soft-hover);
      }

      .stepper input {
        min-height: 40px;
        border: 0;
        border-right: 1px solid var(--line);
        border-left: 1px solid var(--line);
        border-radius: 0;
        background: var(--field-strong);
        padding: 0 6px;
        text-align: center;
        font-weight: 850;
        -moz-appearance: textfield;
      }

      .stepper input::-webkit-outer-spin-button,
      .stepper input::-webkit-inner-spin-button {
        margin: 0;
        -webkit-appearance: none;
      }

      .number-control[hidden] {
        display: none;
      }

      .set-control[hidden] {
        display: none;
      }

      button:hover {
        background: var(--accent-dark);
      }

      .output {
        min-height: 260px;
        padding: 12px;
      }

      .sets {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .set {
        --row-bg: #fffdfa;
        --row-ball-bg: #eef7f6;
        --row-ball-border: #b9ded9;
        --row-ball-text: #063f3a;
        --row-index-bg: rgba(15, 118, 110, 0.08);
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px;
        align-items: stretch;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--row-bg);
      }

      .set:nth-child(4n + 1) {
        --row-bg: #fffdfa;
        --row-ball-bg: #eef7f6;
        --row-ball-border: #b9ded9;
        --row-ball-text: #063f3a;
        --row-index-bg: rgba(15, 118, 110, 0.08);
      }

      .set:nth-child(4n + 2) {
        --row-bg: #fff7ed;
        --row-ball-bg: #fff1df;
        --row-ball-border: #f0c487;
        --row-ball-text: #6f3f08;
        --row-index-bg: rgba(240, 196, 135, 0.2);
      }

      .set:nth-child(4n + 3) {
        --row-bg: #f5f7ff;
        --row-ball-bg: #edf2ff;
        --row-ball-border: #bdcaff;
        --row-ball-text: #243875;
        --row-index-bg: rgba(189, 202, 255, 0.22);
      }

      .set:nth-child(4n + 4) {
        --row-bg: #f7f3ff;
        --row-ball-bg: #f0e9ff;
        --row-ball-border: #ccb9f4;
        --row-ball-text: #4d2a82;
        --row-index-bg: rgba(204, 185, 244, 0.22);
      }

      [data-theme="dark"] .set:nth-child(4n + 1) {
        --row-bg: #121c1a;
        --row-ball-bg: #1d3733;
        --row-ball-border: #367a70;
        --row-ball-text: #b8f1e8;
        --row-index-bg: rgba(68, 184, 168, 0.13);
      }

      [data-theme="dark"] .set:nth-child(4n + 2) {
        --row-bg: #20180f;
        --row-ball-bg: #332312;
        --row-ball-border: #8a5d20;
        --row-ball-text: #ffdca8;
        --row-index-bg: rgba(212, 146, 47, 0.16);
      }

      [data-theme="dark"] .set:nth-child(4n + 3) {
        --row-bg: #141928;
        --row-ball-bg: #1c2540;
        --row-ball-border: #5269a9;
        --row-ball-text: #dce5ff;
        --row-index-bg: rgba(107, 132, 204, 0.17);
      }

      [data-theme="dark"] .set:nth-child(4n + 4) {
        --row-bg: #1b1726;
        --row-ball-bg: #2a2140;
        --row-ball-border: #735da7;
        --row-ball-text: #eadfff;
        --row-index-bg: rgba(142, 116, 202, 0.18);
      }

      .set-index {
        display: grid;
        min-width: 2.4rem;
        min-height: 4.8rem;
        place-items: center;
        padding: 0 0.35rem;
        border-radius: 6px;
        background: var(--row-index-bg);
        color: var(--muted);
        font-size: 1.8rem;
        font-weight: 900;
        line-height: 1;
        opacity: 0.48;
      }

      .numbers {
        display: grid;
        grid-template-columns: repeat(3, 38px);
        gap: 6px;
        width: max-content;
        justify-self: end;
      }

      .ball {
        display: inline-grid;
        place-items: center;
        width: 38px;
        aspect-ratio: 1;
        border: 1px solid var(--row-ball-border);
        border-radius: 50%;
        background: var(--row-ball-bg);
        color: var(--row-ball-text);
        font-weight: 850;
        line-height: 1;
      }

      .empty {
        margin: 0;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        main {
          width: min(520px, calc(100vw - 16px));
          padding: 10px 0;
        }

        .shell {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .intro {
          padding: 0;
        }

        .theme-toggle {
          margin-top: 8px;
        }

        h1 {
          margin-bottom: 4px;
          font-size: 1.65rem;
        }

        .intro p {
          font-size: 0.86rem;
          line-height: 1.4;
        }

        .controls {
          grid-template-columns: minmax(0, 1fr) minmax(5.4rem, 0.48fr);
          gap: 8px;
          padding: 10px;
        }

        .mode-control {
          grid-column: auto;
        }

        .controls[data-mode="number"] .mode-control,
        .controls[data-mode="number"] .number-control,
        .controls[data-mode="set"] .mode-control,
        .controls[data-mode="set"] .set-control {
          grid-column: 1 / -1;
        }

        .set-control,
        .number-control {
          min-width: 0;
        }

        .controls > button {
          grid-column: 1 / -1;
          width: 100%;
          white-space: nowrap;
        }

        .output {
          min-height: 220px;
          padding: 10px;
        }

        .set {
          gap: 6px;
        }

        .ball {
          width: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <section class="intro" aria-labelledby="page-title">
          <h1 id="page-title">Mark Six Generator</h1>
          <span class="version">Version 1.1.1</span>
          <p>
            You're not gambling. You're donating. Thanks for your contribution.
          </p>
          <a class="learn-more" href="explanation.html">How it works</a>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">Dark mode</button>
        </section>

        <section class="panel" aria-label="Generator">
          <form class="controls" id="generator-form">
            <fieldset class="mode-control">
              <legend>Mode</legend>
              <div class="mode-options">
                <label>
                  <input type="radio" name="mode" value="number">
                  <span>Number</span>
                </label>
                <label>
                  <input type="radio" name="mode" value="set" checked>
                  <span>Set</span>
                </label>
              </div>
            </fieldset>
            <div class="control-group number-control">
              <span id="number-count-label">Numbers to generate</span>
              <span class="stepper">
                <button type="button" id="decrease-number" aria-label="Decrease numbers to generate">-</button>
                <input
                  id="number-count"
                  name="number-count"
                  type="number"
                  aria-labelledby="number-count-label"
                  min="1"
                  max="49"
                  step="1"
                  value="7"
                  inputmode="numeric"
                >
                <button type="button" id="increase-number" aria-label="Increase numbers to generate">+</button>
              </span>
            </div>
            <div class="control-group set-control" hidden>
              <span id="set-count-label">Number of sets</span>
              <span class="stepper">
                <button type="button" id="decrease-set" aria-label="Decrease number of sets">-</button>
                <input
                  id="set-count"
                  name="set-count"
                  type="number"
                  aria-labelledby="set-count-label"
                  min="1"
                  max="100"
                  step="1"
                  value="2"
                  inputmode="numeric"
                >
                <button type="button" id="increase-set" aria-label="Increase number of sets">+</button>
              </span>
            </div>
            <button type="submit">Generate</button>
          </form>

          <div class="output" id="output" aria-live="polite">
            <p class="empty">Choose a mode and generate your numbers.</p>
          </div>
        </section>
      </div>
    </main>

    <script>
      const form = document.querySelector("#generator-form");
      const countInput = document.querySelector("#set-count");
      const numberControl = document.querySelector(".number-control");
      const setControl = document.querySelector(".set-control");
      const numberInput = document.querySelector("#number-count");
      const decreaseNumberButton = document.querySelector("#decrease-number");
      const increaseNumberButton = document.querySelector("#increase-number");
      const decreaseSetButton = document.querySelector("#decrease-set");
      const increaseSetButton = document.querySelector("#increase-set");
      const themeToggle = document.querySelector("#theme-toggle");
      const output = document.querySelector("#output");
      const storedTheme = localStorage.getItem("mark-six-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";

      const setTheme = (theme) => {
        document.documentElement.dataset.theme = theme;
        themeToggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
        themeToggle.setAttribute(
          "aria-label",
          theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
        );
      };

      const getMode = () =>
        document.querySelector('input[name="mode"]:checked').value;

      const clamp = (value, min, max) =>
        Math.min(Math.max(Math.floor(Number(value) || min), min), max);

      const syncMode = () => {
        const mode = getMode();

        form.dataset.mode = mode;
        numberControl.hidden = mode === "set";
        setControl.hidden = mode === "number";
      };

      const updateNumberCount = (change) => {
        numberInput.value = String(clamp(Number(numberInput.value) + change, 1, 49));
      };

      const updateSetCount = (change) => {
        countInput.value = String(clamp(Number(countInput.value) + change, 1, 100));
      };

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./service-worker.js");
        });
      }

      const generateSet = (sizeOfSet) => {
        const newSet = new Set();

        while (newSet.size < sizeOfSet) {
          newSet.add(Math.floor(Math.random() * 49) + 1);
        }

        return Array.from(newSet).sort((a, b) => a - b);
      };

      const render = (sets) => {
        const listItems = sets
          .map((set, index) => {
            const balls = set
              .map((number) => `<span class="ball">${number}</span>`)
              .join("");

            return `
              <li class="set">
                <span class="set-index">${index + 1}</span>
                <span class="numbers">${balls}</span>
              </li>
            `;
          })
          .join("");

        output.innerHTML = `
          <ol class="sets">${listItems}</ol>
        `;
      };

      const generate = () => {
        const mode = getMode();
        const boundedNumOfSet = clamp(countInput.value, 1, 100);
        const sizeOfSet = mode === "number" ? clamp(numberInput.value, 1, 49) : 6;
        const numberOfSets = mode === "number" ? 1 : boundedNumOfSet;
        const sets = Array.from({ length: numberOfSets }, () =>
          generateSet(sizeOfSet)
        );

        countInput.value = String(boundedNumOfSet);
        if (mode === "number") {
          numberInput.value = String(sizeOfSet);
        }
        render(sets);
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        generate();
      });

      decreaseNumberButton.addEventListener("click", () => {
        updateNumberCount(-1);
        generate();
      });

      increaseNumberButton.addEventListener("click", () => {
        updateNumberCount(1);
        generate();
      });

      decreaseSetButton.addEventListener("click", () => {
        updateSetCount(-1);
        generate();
      });

      increaseSetButton.addEventListener("click", () => {
        updateSetCount(1);
        generate();
      });

      numberInput.addEventListener("change", () => {
        if (getMode() === "number") {
          generate();
        }
      });

      countInput.addEventListener("change", () => {
        if (getMode() === "set") {
          generate();
        }
      });

      themeToggle.addEventListener("click", () => {
        const nextTheme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark";

        localStorage.setItem("mark-six-theme", nextTheme);
        setTheme(nextTheme);
      });

      form.addEventListener("change", (event) => {
        if (event.target.name === "mode") {
          syncMode();
          generate();
        }
      });

      setTheme(storedTheme || preferredTheme);
      syncMode();
      generate();
    </script>
  </body>
</html>
