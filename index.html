<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark Six Generator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --panel: #ffffff;
        --text: #202124;
        --muted: #687078;
        --line: #d9d2c4;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --chip: #eef7f6;
        --shadow: 0 18px 50px rgba(32, 33, 36, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(320px, 1.1fr);
        gap: 28px;
        align-items: start;
      }

      .intro {
        padding: 14px 0;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.2rem, 7vw, 4.9rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .intro p {
        max-width: 32rem;
        margin: 0;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.7;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      input,
      button {
        min-height: 46px;
        border-radius: 8px;
        font: inherit;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        padding: 0 13px;
        color: var(--text);
        background: #fffdfa;
        font-size: 1.08rem;
      }

      button {
        align-self: end;
        border: 0;
        padding: 0 18px;
        background: var(--accent);
        color: white;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      .output {
        min-height: 360px;
        padding: 18px;
      }

      .timestamp {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .sets {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .set {
        display: grid;
        grid-template-columns: 2.6rem 1fr;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffdfa;
      }

      .set-index {
        color: var(--muted);
        font-weight: 800;
      }

      .numbers {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .ball {
        display: inline-grid;
        place-items: center;
        width: 42px;
        aspect-ratio: 1;
        border: 1px solid #b9ded9;
        border-radius: 50%;
        background: var(--chip);
        color: #063f3a;
        font-weight: 850;
        line-height: 1;
      }

      .empty {
        margin: 0;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        main {
          padding: 28px 0;
        }

        .shell,
        .controls {
          grid-template-columns: 1fr;
        }

        .intro {
          padding: 0;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <section class="intro" aria-labelledby="page-title">
          <h1 id="page-title">Mark Six Generator</h1>
          <p>
            Generate unique sorted Mark Six numbers with the same behavior as
            the current command-line report.
          </p>
        </section>

        <section class="panel" aria-label="Generator">
          <form class="controls" id="generator-form">
            <label for="set-count">
              Number of sets
              <input
                id="set-count"
                name="set-count"
                type="number"
                min="1"
                max="100"
                step="1"
                value="1"
                inputmode="numeric"
              >
            </label>
            <button type="submit">Generate</button>
          </form>

          <div class="output" id="output" aria-live="polite">
            <p class="empty">Choose how many sets to generate.</p>
          </div>
        </section>
      </div>
    </main>

    <script>
      const form = document.querySelector("#generator-form");
      const countInput = document.querySelector("#set-count");
      const output = document.querySelector("#output");

      const formatDate = (date) => date.toLocaleString();

      const generateSet = (sizeOfSet) => {
        const newSet = new Set();

        while (newSet.size < sizeOfSet) {
          newSet.add(Math.floor(Math.random() * 49) + 1);
        }

        return Array.from(newSet).sort((a, b) => a - b);
      };

      const render = (sets, startedAt, endedAt) => {
        const listItems = sets
          .map((set, index) => {
            const balls = set
              .map((number) => `<span class="ball">${number}</span>`)
              .join("");

            return `
              <li class="set">
                <span class="set-index">${index + 1}:</span>
                <span class="numbers">${balls}</span>
              </li>
            `;
          })
          .join("");

        output.innerHTML = `
          <p class="timestamp">====${formatDate(startedAt)}</p>
          <ol class="sets">${listItems}</ol>
          <p class="timestamp" style="margin: 16px 0 0;">====${formatDate(endedAt)}</p>
        `;
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const numOfSet = Number(countInput.value) || 1;
        const boundedNumOfSet = Math.min(Math.max(Math.floor(numOfSet), 1), 100);
        const sizeOfSet = boundedNumOfSet === 1 ? 7 : 6;
        const startedAt = new Date();
        const sets = Array.from({ length: boundedNumOfSet }, () =>
          generateSet(sizeOfSet)
        );

        countInput.value = String(boundedNumOfSet);
        render(sets, startedAt, new Date());
      });
    </script>
  </body>
</html>
